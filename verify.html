<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification — NYRON</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: min(700px, 100%);
            padding: 50px 35px;
            text-align: center;
            border: 1px solid #d6a928;
            background: #0b0b0b;
            box-shadow: 0 0 40px rgba(214,169,40,.15);
        }

        .check {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .verified {
            color: #d6a928;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .line {
            width: 120px;
            height: 2px;
            background: #d6a928;
            margin: 25px auto;
        }

        .label {
            color: #888;
            font-size: 13px;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        .value {
            font-size: 22px;
            font-weight: bold;
            margin-top: 7px;
        }

        .prize {
            color: #f0c84b;
            font-size: 28px;
            font-weight: 900;
            margin-top: 25px;
        }

        .valid {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 25px;
            border: 1px solid #d6a928;
            color: #d6a928;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="check">✓</div>

        <div class="verified">
            CERTIFICATE VERIFIED
        </div>

        <div class="line"></div>

        <div class="label">
            TOURNAMENT
        </div>

        <div class="value">
            NYRON MLBB MINI TOURNAMENT
        </div>

        <div class="label">
            TEAM
        </div>

        <div class="value">
            TEAM NAME
        </div>

        <div class="label">
            RESULT
        </div>

        <div class="value">
            🥇 1-O‘RIN — CHAMPION
        </div>

        <div class="prize">
            3000 💎
        </div>

        <div class="label">
            CERTIFICATE ID
        </div>

        <div class="value">
            NYRON-2026-001
        </div>

        <div class="valid">
            ✓ VALID
        </div>

    </div>

</body>
</html>
